<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#090909"><title>العميل صفر — سجل مهمة</title><link rel="stylesheet" href="agent_zero.css"></head><body class="agent-zero-reading"><div class="agent-zero-cursor"></div><div class="agent-zero-scan"></div><div class="agent-reading-shell"><div class="agent-reading-top"><a id="backLink" href="agent_zero.html">← العودة إلى ملف العميل</a><span class="agent-reading-label">CLASSIFIED / MISSION LOG</span><a href="index.html">المكتبة</a></div><main class="agent-reading-paper"><div class="agent-reading-kicker">AGENT ZERO // FIELD RECORD</div><h1 id="chapterTitle" class="agent-reading-title">جاري تحميل السجل...</h1><p id="chapterMeta" class="agent-reading-subtitle"></p><article id="content" class="agent-reading-content"></article></main><nav class="agent-reading-nav"><a id="prevLink" href="#">← السابق</a><a id="nextLink" href="#">التالي →</a></nav></div><script type="module">
import{db,collection,getDocs,getDoc,query,where,doc}from'./site.js';const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('content');const cur=document.querySelector('.agent-zero-cursor'),scan=document.querySelector('.agent-zero-scan');if(!matchMedia('(pointer:coarse)').matches){addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';scan.style.left=e.clientX+'px'},{passive:true});document.querySelectorAll('a').forEach(el=>{el.addEventListener('mouseenter',()=>cur.classList.add('is-hover'));el.addEventListener('mouseleave',()=>cur.classList.remove('is-hover'))})}else{cur.remove();scan.remove()}const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function applyCursor(theme={}){cur.classList.remove('cursor-dragon','cursor-memory','cursor-dot');if(theme.cursorColor)document.documentElement.style.setProperty('--az-accent',theme.cursorColor);if(theme.cursorStyle==='dragon')cur.classList.add('cursor-dragon');else if(theme.cursorStyle==='memory')cur.classList.add('cursor-memory');else if(theme.cursorStyle==='dot')cur.classList.add('cursor-dot')}
try{if(!id)throw Error('missing');const snap=await getDoc(doc(db,'chapters',id));if(!snap.exists())throw Error('missing chapter');const c={id:snap.id,...snap.data()},n=Number.isFinite(Number(c.number))&&Number(c.number)>0?Number(c.number):'';if(c.novelId){const ns=await getDoc(doc(db,'novels',c.novelId));if(ns.exists())applyCursor(ns.data().theme||{})}document.title=`العميل صفر — ${n?'الفصل '+n+': ':''}${c.title||'سجل مهمة'}`;document.getElementById('chapterTitle').textContent=c.title||'سجل مهمة';document.getElementById('chapterMeta').textContent=n?`الفصل ${n} • محفوظ في ملف المطاردة`:'محفوظ في ملف المطاردة';const ps=String(c.content||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);root.innerHTML=ps.length?ps.map(p=>`<p class="${/^[^:：]{1,40}[:：]/.test(p.trim())?'dialogue':''}">${esc(p).replace(/\n/g,'<br>')}</p>`).join(''):'<p>لا يوجد نص لهذا الفصل.</p>';const all=(await getDocs(query(collection(db,'chapters'),where('novelId','==',c.novelId)))).docs.map(d=>({id:d.id,...d.data()}));all.sort((a,b)=>{const an=Number(a.number)||999999,bn=Number(b.number)||999999;if(an!==bn)return an-bn;return(a.createdAt?.seconds??0)-(b.createdAt?.seconds??0)});const i=all.findIndex(x=>x.id===c.id);if(i>0)document.getElementById('prevLink').href='agent_zero_chapter.html?id='+encodeURIComponent(all[i-1].id);else document.getElementById('prevLink').style.visibility='hidden';if(i>=0&&i<all.length-1)document.getElementById('nextLink').href='agent_zero_chapter.html?id='+encodeURIComponent(all[i+1].id);else document.getElementById('nextLink').style.visibility='hidden';document.getElementById('backLink').href='agent_zero.html?id='+encodeURIComponent(c.novelId||'')}catch(e){console.error(e);document.getElementById('chapterTitle').textContent='تعذر تحميل السجل';document.getElementById('chapterMeta').textContent='تأكد من رابط الفصل واتصال Firebase.';root.innerHTML='<p>تعذر تحميل الفصل.</p>'}
</script></body></html>
