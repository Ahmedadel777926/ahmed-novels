<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قرار الذكريات — الفصل</title><link rel="stylesheet" href="decision_memories.css"></head><body class="memory-world"><div class="memory-cursor" id="memoryCursor"></div><header class="memory-nav"><a class="brand" id="brand" href="decision_memories.html">قرار الذكريات</a><span class="world-name">سجلات الذكريات</span></header><main class="section"><section class="panel memory-main"><div class="kicker" id="label">الفصل</div><h1 id="title">جارٍ تحميل الفصل...</h1><article id="content" class="hero-line"></article><div class="actions"><a class="btn" id="back" href="decision_memories.html">العودة للرواية</a></div></section></main><script type="module">import{db,getDoc,doc}from'./site.js';const id=new URLSearchParams(location.search).get('id'),t=document.getElementById('title'),c=document.getElementById('content'),l=document.getElementById('label');function esc(v){return String(v??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[x]))}function applyCursor(theme={}){const c=document.getElementById('memoryCursor');if(!c)return;c.classList.remove('cursor-dragon','cursor-crosshair','cursor-dot');if(theme.cursorColor)document.documentElement.style.setProperty('--dm-ice',theme.cursorColor);if(theme.cursorStyle==='dragon')c.classList.add('cursor-dragon');else if(theme.cursorStyle==='crosshair')c.classList.add('cursor-crosshair');else if(theme.cursorStyle==='dot')c.classList.add('cursor-dot');}async function load(){try{const s=await getDoc(doc(db,'chapters',id));if(!s.exists())throw 0;const x=s.data();if(x.novelId){const ns=await getDoc(doc(db,'novels',x.novelId));if(ns.exists())applyCursor(ns.data().theme||{});}l.textContent=`الفصل ${x.number??''}`;t.textContent=x.title||'فصل بلا عنوان';document.title=`قرار الذكريات — ${x.title||'الفصل'}`;c.innerHTML=String(x.content||'').split(/\n{2,}/).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')||'<p>لا يوجد نص.</p>';if(x.novelId)document.getElementById('back').href='decision_memories.html?id='+encodeURIComponent(x.novelId)}catch(e){t.textContent='تعذر تحميل الفصل';c.innerHTML='<p>حدث خطأ أثناء تحميل الفصل.</p>'}}addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px')});const cur=document.getElementById('memoryCursor');if(!matchMedia('(pointer:coarse)').matches){addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});document.querySelectorAll('a').forEach(a=>{a.onmouseenter=()=>cur.classList.add('active');a.onmouseleave=()=>cur.classList.remove('active')})}else cur.remove();load();</script></body></html>
