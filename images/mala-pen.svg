<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050607"/><stop offset=".22" stop-color="#303238"/>
    <stop offset=".42" stop-color="#b7bac0"/><stop offset=".5" stop-color="#565960"/>
    <stop offset=".78" stop-color="#15171a"/><stop offset="1" stop-color="#020304"/>
  </linearGradient>
  <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0a0b0d"/><stop offset=".38" stop-color="#777a80"/><stop offset=".5" stop-color="#e1e2e4"/><stop offset=".58" stop-color="#4c4f55"/><stop offset="1" stop-color="#08090a"/>
  </linearGradient>
  <linearGradient id="goldless" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f4f5"/><stop offset=".5" stop-color="#7b7e84"/><stop offset="1" stop-color="#d9dade"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-opacity=".75"/></filter>
</defs>
<!-- premium curved fountain pen, monochrome -->
<g transform="rotate(-22 32 32)" filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
  <!-- elegant tapered barrel -->
  <path d="M17 40 C23 36 27 31 31 25 C35 19 39 14 46 12" fill="none" stroke="#020304" stroke-width="10"/>
  <path d="M17 40 C23 36 27 31 31 25 C35 19 39 14 46 12" fill="none" stroke="url(#body)" stroke-width="7.2"/>
  <!-- central polished highlight -->
  <path d="M20 38 C25 34 28 29 32 24 C36 18 40 15 45 13" fill="none" stroke="#eef0f2" stroke-opacity=".42" stroke-width="1.1"/>
  <!-- cap ring -->
  <path d="M39.8 15.5 L45.8 10.8" stroke="url(#goldless)" stroke-width="2.5"/>
  <path d="M41.2 17.1 L47.2 12.3" stroke="#101114" stroke-width="1"/>
  <!-- clip -->
  <path d="M44 10.8 C48.5 8.4 52.4 10.5 52.2 13.5 C52.1 15.4 50.9 16.4 49.1 17.2" fill="none" stroke="url(#goldless)" stroke-width="1.8"/>
  <circle cx="46.2" cy="11.3" r="1.15" fill="#f1f2f3"/>
  <!-- grip -->
  <path d="M16.8 39.9 L11.7 45.1" stroke="#0a0b0d" stroke-width="7.2"/>
  <path d="M16.8 39.9 L11.7 45.1" stroke="url(#barrel)" stroke-width="5.2"/>
  <!-- nib collar -->
  <path d="M12.2 44.5 L16 48.1" stroke="url(#goldless)" stroke-width="2.4"/>
  <!-- fine nib -->
  <path d="M12.1 45 L2.8 55.8 L6.7 41.4 Z" fill="url(#goldless)" stroke="#111216" stroke-width="1"/>
  <path d="M4.1 53.8 L12.1 45" stroke="#55585e" stroke-width=".8"/>
  <path d="M7.1 48.8 L8.7 50.4" stroke="#f0f1f2" stroke-opacity=".75" stroke-width=".7"/>
  <!-- tiny ink slit -->
  <path d="M6.7 42.3 L7.1 51.7" stroke="#17191c" stroke-width=".8"/>
</g>
</svg>
