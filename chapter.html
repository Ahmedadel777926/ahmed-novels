<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0908">
<title>أورورا — الفصل</title>
<link rel="stylesheet" href="style.css?v=aurora-sword-white-2">
<style>html,body{cursor:auto}body a,body button,body input,body textarea,body select{cursor:pointer}</style>
<style id="follow-cursor-sword">
  #ahmed-follow-cursor-sword{
    position:fixed;left:0;top:0;width:64px;height:64px;
    pointer-events:none;z-index:2147483647;display:none;
    transform:translate(-8px,-8px);
    will-change:transform;
  }
  #ahmed-follow-cursor-sword svg{display:block;width:100%;height:100%}
  @media (hover:hover) and (pointer:fine){
    body.cursor-follow-sword{cursor:none!important}
    body.cursor-follow-sword a,body.cursor-follow-sword button,
    body.cursor-follow-sword input,body.cursor-follow-sword textarea,
    body.cursor-follow-sword select{cursor:none!important}
  }
</style>
<script>
(function(){
  const c=document.createElement('div');
  c.id='ahmed-follow-cursor-sword';
  c.setAttribute('aria-hidden','true');
  c.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#e7ebef"/><stop offset=".52" stop-color="#fff"/><stop offset=".75" stop-color="#aeb7c2"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#626b76"/><stop offset=".5" stop-color="#a2aab4"/><stop offset="1" stop-color="#59616c"/></linearGradient></defs><g transform="rotate(-43 32 32)"><path d="M31 4L34.2 7L35.2 39.5L32 44L28.8 39.5L29.8 7Z" fill="url(#s)" stroke="#fff" stroke-width=".8"/><path d="M31.1 8L32 6.2L32.9 8L33.4 37.8L32 40.5L30.6 37.8Z" fill="#fff" opacity=".8"/><path d="M22.5 41.5Q32 38.8 41.5 41.5L40.8 44Q32 42.1 23.2 44Z" fill="url(#s)" stroke="#fff" stroke-width=".8"/><rect x="29.1" y="43" width="5.8" height="12.5" rx="2.1" fill="url(#g)" stroke="#dce1e6" stroke-width=".7"/><rect x="30.7" y="48.2" width="2.6" height="1.5" rx=".5" fill="#48a9ff"/><path d="M27.7 55Q32 52.8 36.3 55L35.7 59Q32 61.2 28.3 59Z" fill="url(#s)" stroke="#fff" stroke-width=".8"/></g></svg>';
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.appendChild(c);
  });
  document.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse') return;
    document.body.classList.add('cursor-follow-sword');
    c.style.display='block';
    c.style.transform='translate('+(e.clientX-8)+'px,'+(e.clientY-8)+'px)';
  },{passive:true});
  document.addEventListener('mouseleave',()=>c.style.display='none');
  document.addEventListener('mouseenter',()=>{
    if(document.body.classList.contains('cursor-follow-sword'))c.style.display='block';
  });
})();
</script>
</head>
<body class="aurora-reading-page">
<div class="aurora-atmosphere" aria-hidden="true"></div>
<div class="aurora-cursor-glow" aria-hidden="true"></div>
<div class="aurora-progress" aria-hidden="true"><div class="aurora-progress-bar" id="progressBar"></div></div>

<div class="aurora-reading-top">
  <a class="aurora-reading-brand" href="aurora.html">⚔️ أورورا</a>
  <div class="aurora-reading-tools">
    <a class="aurora-tool" id="backLink" href="aurora.html">سجل الرواية</a>
    <button class="aurora-tool" id="focusBtn" type="button">وضع التركيز</button>
  </div>
</div>

<main class="aurora-reading-shell">
  <header class="aurora-reading-head">
    <p class="aurora-reading-eyebrow" id="siteTitle">Aurora • Imperial Archives</p>
    <h1 class="aurora-reading-title" id="heading">الفصل</h1>
    <p class="aurora-reading-subtitle" id="chapterTitle"></p>
    <div class="aurora-rule"></div>
  </header>

  <article class="aurora-reading-paper">
    <div id="content" class="aurora-reading-content"></div>
  </article>
</main>

<nav class="aurora-reading-nav" aria-label="تنقل الفصول">
  <a id="prevLink" href="#" hidden>← الفصل السابق</a>
  <a id="nextLink" href="#" hidden>الفصل التالي →</a>
</nav>

<script type="module">
import { db, getDoc, doc, collection, getDocs } from './site.js';

const id = new URLSearchParams(location.search).get('id');
const content = document.getElementById('content');
const bar = document.getElementById('progressBar');

function addAtmosphere() {
  const root = document.querySelector('.aurora-atmosphere');
  for (let i = 0; i < 16; i++) {
    const ember = document.createElement('span');
    ember.className = 'ember';
    ember.style.setProperty('--left', `${Math.random() * 100}%`);
    ember.style.setProperty('--duration', `${6 + Math.random() * 8}s`);
    ember.style.setProperty('--delay', `${-Math.random() * 10}s`);
    ember.style.setProperty('--drift', `${-60 + Math.random() * 120}px`);
    root.appendChild(ember);
  }
}

function initEffects() {
  addAtmosphere();
  const glow = document.querySelector('.aurora-cursor-glow');
  if (glow && !matchMedia('(pointer: coarse)').matches) {
    addEventListener('pointermove', e => {
      glow.style.left = `${e.clientX}px`;
      glow.style.top = `${e.clientY}px`;
    }, { passive: true });
  }
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('aurora-hovering'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('aurora-hovering'));
  });
}

function updateProgress() {
  const docEl = document.documentElement;
  const max = docEl.scrollHeight - innerHeight;
  const pct = max > 0 ? Math.min(100, Math.max(0, (scrollY / max) * 100)) : 0;
  bar.style.width = pct + '%';
}

initEffects();
addEventListener('scroll', updateProgress, { passive: true });
updateProgress();

document.getElementById('focusBtn').addEventListener('click', () => {
  document.body.classList.toggle('aurora-focus');
});

try {
  if (!id) throw new Error('missing');
  const snap = await getDoc(doc(db, 'chapters', id));
  if (!snap.exists()) throw new Error('missing');
  const c = { id: snap.id, ...snap.data() };
  const number = Number(c.number);
  const chapterLabel = Number.isFinite(number) && number > 0
    ? `الفصل ${number}: ${c.title || 'بدون عنوان'}`
    : (c.title || 'الفصل');

  document.title = `${chapterLabel} — أورورا`;
  document.getElementById('siteTitle').textContent = c.novelTitle || 'Aurora • Imperial Archives';
  document.getElementById('chapterTitle').textContent = chapterLabel;
  document.getElementById('heading').textContent = c.title || chapterLabel;
  if (c.novelId) document.getElementById('backLink').href = 'aurora.html?id=' + encodeURIComponent(c.novelId);

  content.innerHTML = '';
  const paragraphs = String(c.content || '').split(/\r?\n{2,}/);
  for (const text of paragraphs) {
    if (!text.trim()) continue;
    const p = document.createElement('p');
    p.textContent = text.trim();
    content.appendChild(p);
  }

  if (c.novelId) {
    const chSnap = await getDocs(collection(db, 'chapters'));
    const chapters = chSnap.docs.map(d => ({ id:d.id, ...d.data() }))
      .filter(x => x.novelId === c.novelId)
      .sort((a,b) => {
        const an = a.number ?? 999999, bn = b.number ?? 999999;
        if (an !== bn) return an - bn;
        return (a.createdAt?.seconds ?? 0) - (b.createdAt?.seconds ?? 0);
      });
    const index = chapters.findIndex(x => x.id === c.id);
    const prev = chapters[index - 1];
    const next = chapters[index + 1];
    const prevLink = document.getElementById('prevLink');
    const nextLink = document.getElementById('nextLink');
    if (prev) {
      prevLink.hidden = false;
      prevLink.href = 'chapter.html?id=' + encodeURIComponent(prev.id);
      prevLink.textContent = `← ${prev.title || 'الفصل السابق'}`;
    }
    if (next) {
      nextLink.hidden = false;
      nextLink.href = 'chapter.html?id=' + encodeURIComponent(next.id);
      nextLink.textContent = `${next.title || 'الفصل التالي'} →`;
    }
  }
} catch (e) {
  console.error(e);
  content.innerHTML = '<p style="color:#aaa">تعذر تحميل الفصل.</p>';
}
</script>
</body>
</html>
