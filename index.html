<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Novels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="site-logo"><span class="logo-mark">✦</span> Ahmed Novels <span class="logo-mark">✦</span></h1>
  <p>✨ اكتشف عوالم الكاتب أحمد، حيث تولد الحكايات وتُصنع الأساطير وتبدأ رحلات شخصيات لا تُنسى.</p>
</header>

<section class="author-bio" id="authorBio">
  <h2>نبذة عن الكاتب</h2>
  <p id="authorBioText">جارٍ تحميل النبذة...</p>
</section>

<section class="books" id="books">
  <p style="color:#aaa">جارٍ تحميل الروايات...</p>
</section>

<script type="module">
import { db, collection, getDocs, getDoc, doc } from './site.js';

const root = document.getElementById('books');
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
}[c]));

function malaCard(){
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <img src="images/mala-cover.jpeg?v=20260924" alt="غلاف ما لا ينتهي في رأسي"
         onerror="this.onerror=null;this.src='images/mala-cover.jpeg'">
    <h2>ما لا ينتهي في رأسي</h2>
    <p>تاي لا تنقصه القوة... لكنه اختار الصمت. وفي رأسه تبدأ معركته الخاصة لفهم مشاعره.</p>
    <a href="mala.html"><button>اقرأ الآن</button></a>`;
  return card;
}

// مالا محلية بالكامل: لا تنتظر Firebase ولا تأخذ الغلاف أو الرابط من أي سجل.
root.innerHTML='';
root.appendChild(malaCard());

try {
  const bioSnap = await getDoc(doc(db, 'siteSettings', 'about'));
  const bioText = document.getElementById('authorBioText');
  bioText.textContent = bioSnap.exists() && bioSnap.data().bio
    ? bioSnap.data().bio
    : 'أضف نبذة عن الكاتب من لوحة الأدمن.';

  const snap = await getDocs(collection(db, 'novels'));
  const novels = snap.docs.map(d => ({ id:d.id, ...d.data() }))
    .filter(n => !/ما\s*لا\s*ينتهي\s*في\s*رأس[يى]/i.test(String(n.title||'')));

  novels.sort((a,b)=>(b.createdAt?.seconds??0)-(a.createdAt?.seconds??0));

  for(const n of novels){
    const titleText=String(n.title||'');
    const normalizedTitle=titleText.normalize('NFKD')
      .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
      .replace(/\s+/g,' ').trim();

    const isAgentZero=/العميل\s*صفر|مطاردة\s*صفر/i.test(normalizedTitle);
    const isNerval=/نيرفال|زافيريون/i.test(normalizedTitle);
    const isDecision=/قرار\s*الذكريات/i.test(normalizedTitle);
    const targetPage=isDecision?'decision_memories.html':
      (isNerval?'nerval.html':(isAgentZero?'agent_zero.html':'aurora.html'));
    const coverDefault=isDecision?'images/decision-memory-cover.jpg':
      (isAgentZero?'images/agent-zero-cover.jpg':
      (isNerval?'images/nerval-cover.jpeg':'images/aurora.jpeg'));
    const coverSrc=n.coverUrl||coverDefault;

    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <img src="${esc(coverSrc)}" onerror="this.onerror=null;this.src='${coverDefault}'" alt="${esc(titleText||'رواية')}">
      <h2>${esc(titleText||'بدون اسم')}</h2>
      <p>${esc(n.description||'')}</p>
      <a href="${targetPage}?id=${encodeURIComponent(n.id)}"><button>اقرأ الآن</button></a>`;
    root.appendChild(card);
  }
} catch(e) {
  console.error('Firebase novels failed:',e);
  // مالا يظل ظاهرًا حتى لو Firebase غير متاح.
}
</script>
</body>
</html>
