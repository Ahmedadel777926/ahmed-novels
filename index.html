<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Novels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="site-logo"><span class="logo-mark">✦</span> Ahmed Novels <span class="logo-mark">✦</span></h1>
  <p>✨ اكتشف عوالم الكاتب أحمد، حيث تولد الحكايات وتُصنع الأساطير وتبدأ رحلات شخصيات لا تُنسى.</p>
</header>

<section class="author-bio" id="authorBio">
  <h2>نبذة عن الكاتب</h2>
  <p id="authorBioText">جارٍ تحميل النبذة...</p>
</section>

<section class="books" id="books">
  <p style="color:#aaa">جارٍ تحميل الروايات...</p>
</section>

<script type="module">
import { db, collection, getDocs, getDoc, doc } from './site.js';

const root = document.getElementById('books');
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
}[c]));

try {
  const bioSnap = await getDoc(doc(db, 'siteSettings', 'about'));
  const bioText = document.getElementById('authorBioText');
  if (bioSnap.exists() && bioSnap.data().bio) {
    bioText.textContent = bioSnap.data().bio;
  } else {
    bioText.textContent = 'أضف نبذة عن الكاتب من لوحة الأدمن.';
  }

  const snap = await getDocs(collection(db, 'novels'));
  const novels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  novels.sort((a,b) => {
    const at = a.createdAt?.seconds ?? 0;
    const bt = b.createdAt?.seconds ?? 0;
    return bt - at;
  });

  // Keep the fifth novel completely independent from Firebase for its identity, cover, and page routing.
  // Remove any Firebase copy of it so the local novel page is always used.
  const filteredNovels = novels.filter(n => !/ما\s*لا\s*ينتهي\s*في\s*رأس[يى]/i.test(String(n.title||'')));
  filteredNovels.push({id:'__mala_local_v2__',title:'ما لا ينتهي في رأسي',description:'تاي لا تنقصه القوة... لكنه اختار الصمت. وفي رأسه تبدأ معركته الخاصة لفهم مشاعره، واكتشاف سبب حاجته للاهتمام الذي لم يطلبه يومًا.',coverUrl:'images/mala-final-cover.jpeg',createdAt:{seconds:0},localOnly:true});
  novels.length = 0;
  novels.push(...filteredNovels);

  root.innerHTML = '';
  if (!novels.length) {
    root.innerHTML = '<p style="color:#aaa">لا توجد روايات مضافة بعد.</p>';
  } else {
    for (const n of novels) {
      const card = document.createElement('div');
      const titleText = String(n.title || '');
      // Normalize Arabic text so small differences in spacing/diacritics do not
      // accidentally send the new novel to the generic fallback page.
      const normalizedTitle = titleText
        .normalize('NFKD')
        .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      const isAgentZero = /العميل\s*صفر|مطاردة\s*صفر/i.test(normalizedTitle);
      const isNerval = /نيرفال|زافيريون/i.test(normalizedTitle);
      const isDecision = /قرار\s*الذكريات/i.test(normalizedTitle);
      const isMala = /ما\s*لا\s*ينتهي\s*في\s*رأس[يى]/i.test(normalizedTitle)
        || (/لا\s*ينتهي/i.test(normalizedTitle) && /رأس[يى]/i.test(normalizedTitle));
      const targetPage = isMala ? 'mala_final.html' : (isDecision ? 'decision_memories.html' : (isNerval ? 'nerval.html' : (isAgentZero ? 'agent_zero.html' : 'aurora.html')));
      const coverDefault = isMala ? 'images/mala-final-cover.jpeg' : (isDecision ? 'images/decision-memory-cover.jpg' : (isAgentZero ? 'images/agent-zero-cover.jpg' : (isNerval ? 'images/nerval-cover.jpeg' : 'images/aurora.jpeg')));
      const coverSrc = isMala ? 'images/mala-final-cover.jpeg' : (n.coverUrl || coverDefault);
      card.className = 'card';
      card.innerHTML = `
        <img src="${esc(coverSrc)}" onerror="this.onerror=null;this.src='${coverDefault}'" alt="${esc(n.title || 'رواية')}">
        <h2>${esc(n.title || 'بدون اسم')}</h2>
        <p>${esc(n.description || '')}</p>
        <a href="${isMala ? 'mala_final.html' : targetPage + '?id=' + encodeURIComponent(n.id)}"><button>اقرأ الآن</button></a>
      `;
      root.appendChild(card);
    }
  }
} catch (e) {
  console.error(e);
  root.innerHTML = `
    <div class="card">
      <img src="images/mala-final-cover.jpeg" alt="غلاف ما لا ينتهي في رأسي">
      <h2>ما لا ينتهي في رأسي</h2>
      <p>تاي لا تنقصه القوة... لكنه اختار الصمت. وفي رأسه تبدأ معركته الخاصة لفهم مشاعره.</p>
      <a href="mala_final.html"><button>اقرأ الآن</button></a>
    </div>`;
}
</script>
</body>
</html>
