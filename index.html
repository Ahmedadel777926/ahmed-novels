<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Novels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="brand-mark">
    <span class="brand-symbol">✦</span>
    <span class="brand-name">Ahmed <em>Novels</em></span>
    <span class="brand-line"></span>
  </div>
  <p class="brand-tagline">حيث تبدأ الحكاية... وتبقى الأسطورة.</p>
</header>

<section class="about-author" id="aboutAuthor">
  <div class="about-inner">
    <div class="about-ornament">✦</div>
    <div>
      <p class="section-kicker">ABOUT THE AUTHOR</p>
      <h2 id="aboutTitle">نبذة عن الكاتب</h2>
      <div id="aboutText"><p>اكتب نبذتك من لوحة الأدمن، وستظهر هنا تلقائيًا.</p></div>
    </div>
  </div>
</section>

<section class="books" id="books">
  <p style="color:#aaa">جارٍ تحميل الروايات...</p>
</section>

<script type="module">
import { db, collection, getDocs } from './site.js';

const root = document.getElementById('books');
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
}[c]));

try {
  const aboutSnap = await getDocs(collection(db, 'siteSettings'));
  const aboutDoc = aboutSnap.docs.find(d => d.id === 'about');
  if (aboutDoc) {
    const about = aboutDoc.data();
    if (about.title) document.getElementById('aboutTitle').textContent = about.title;
    if (about.text) {
      const safe = esc(about.text).replace(/\n\s*\n/g, '</p><p>').replace(/\n/g, '<br>');
      document.getElementById('aboutText').innerHTML = '<p>' + safe + '</p>';
    }
  }

  const snap = await getDocs(collection(db, 'novels'));
  const novels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  novels.sort((a,b) => {
    const at = a.createdAt?.seconds ?? 0;
    const bt = b.createdAt?.seconds ?? 0;
    return bt - at;
  });

  root.innerHTML = '';
  if (!novels.length) {
    root.innerHTML = '<p style="color:#aaa">لا توجد روايات مضافة بعد.</p>';
  } else {
    for (const n of novels) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${esc(n.coverUrl || 'images/aurora.jpeg')}" alt="${esc(n.title || 'رواية')}">
        <h2>${esc(n.title || 'بدون اسم')}</h2>
        <p>${esc(n.description || '')}</p>
        <a href="aurora.html?id=${encodeURIComponent(n.id)}"><button>اقرأ الآن</button></a>
      `;
      root.appendChild(card);
    }
  }
} catch (e) {
  console.error(e);
  root.innerHTML = '<p style="color:#aaa">تعذر تحميل الروايات. تأكد من اتصال Firebase.</p>';
}
</script>
</body>
</html>
