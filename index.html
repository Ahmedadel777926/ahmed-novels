<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Novels</title>
<link rel="stylesheet" href="style.css">
<style>/* scoped cursor main-quill-png-v7 */ html,body{cursor:url("images/writer-quill.png?v=7") 8 8,auto!important} body a,body button,body input,body textarea,body select{cursor:url("images/writer-quill.png?v=7") 8 8,pointer!important}</style>
<style id="follow-cursor-quill">
  #ahmed-follow-cursor-quill{
    position:fixed;left:0;top:0;width:64px;height:64px;
    pointer-events:none;z-index:2147483647;display:none;
    transform:translate(-8px,-8px);background:url("images/writer-quill.png?v=9") center/contain no-repeat;
    will-change:transform;
  }
  @media (hover:hover) and (pointer:fine){
    body.cursor-follow-quill{cursor:none!important}
    body.cursor-follow-quill a,body.cursor-follow-quill button,
    body.cursor-follow-quill input,body.cursor-follow-quill textarea,
    body.cursor-follow-quill select{cursor:none!important}
  }
</style>
<script>
(function(){
  const c=document.createElement('div');
  c.id='ahmed-follow-cursor-quill';
  c.setAttribute('aria-hidden','true');
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.appendChild(c);
    document.body.classList.add('cursor-follow-quill');
    if(matchMedia('(hover:hover) and (pointer:fine)').matches) c.style.display='block';
  });
  document.addEventListener('mousemove',e=>{
    c.style.transform='translate('+(e.clientX-8)+'px,'+(e.clientY-8)+'px)';
  },{passive:true});
  document.addEventListener('mouseleave',()=>c.style.display='none');
  document.addEventListener('mouseenter',()=>{
    if(matchMedia('(hover:hover) and (pointer:fine)').matches)c.style.display='block';
  });
})();
</script>
</head>
<body>
<header>
  <h1 class="site-logo"><span class="logo-mark">✦</span> Ahmed Novels <span class="logo-mark">✦</span></h1>
  <p>✨ اكتشف عوالم الكاتب أحمد، حيث تولد الحكايات وتُصنع الأساطير وتبدأ رحلات شخصيات لا تُنسى.</p>
</header>

<section class="author-bio" id="authorBio">
  <h2>نبذة عن الكاتب</h2>
  <p id="authorBioText">جارٍ تحميل النبذة...</p>
</section>

<section class="books" id="books">
  <p style="color:#aaa">جارٍ تحميل الروايات...</p>
</section>

<script type="module">
import { db, collection, getDocs, getDoc, doc } from './site.js';

const root = document.getElementById('books');
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
}[c]));

try {
  const bioSnap = await getDoc(doc(db, 'siteSettings', 'about'));
  const bioText = document.getElementById('authorBioText');
  if (bioSnap.exists() && bioSnap.data().bio) {
    bioText.textContent = bioSnap.data().bio;
  } else {
    bioText.textContent = 'أضف نبذة عن الكاتب من لوحة الأدمن.';
  }

  const snap = await getDocs(collection(db, 'novels'));
  const novels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  novels.sort((a,b) => {
    const at = a.createdAt?.seconds ?? 0;
    const bt = b.createdAt?.seconds ?? 0;
    return bt - at;
  });

  root.innerHTML = '';
  if (!novels.length) {
    root.innerHTML = '<p style="color:#aaa">لا توجد روايات مضافة بعد.</p>';
  } else {
    for (const n of novels) {
      const card = document.createElement('div');
      const titleText = String(n.title || '');
      const isAgentZero = /العميل\s*صفر|مطاردة\s*صفر/i.test(titleText);
      const isNerval = /نيرفال|زافيريون/i.test(titleText);
      const isDecision = /قرار\s*الذكريات/i.test(titleText);
      const targetPage = isDecision ? 'decision_memories.html' : (isNerval ? 'nerval.html' : (isAgentZero ? 'agent_zero.html' : 'aurora.html'));
      const coverDefault = isDecision ? 'images/decision-memory-cover.jpg' : (isAgentZero ? 'images/agent-zero-cover.jpg' : (isNerval ? 'images/nerval-cover.jpeg' : 'images/aurora.jpeg'));
      card.className = 'card';
      card.innerHTML = `
        <img src="${esc(n.coverUrl || coverDefault)}" alt="${esc(n.title || 'رواية')}">
        <h2>${esc(n.title || 'بدون اسم')}</h2>
        <p>${esc(n.description || '')}</p>
        <a href="${targetPage}?id=${encodeURIComponent(n.id)}"><button>اقرأ الآن</button></a>
      `;
      root.appendChild(card);
    }
  }
} catch (e) {
  console.error(e);
  root.innerHTML = '<p style="color:#aaa">تعذر تحميل الروايات. تأكد من اتصال Firebase.</p>';
}
</script>
</body>
</html>
